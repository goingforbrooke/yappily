[project]
name = "yappily"
version = "0.1.0"
description = "Post the same message to Twitter 🦜, Hachyderm 🐘, and 🌤️Bluesky."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "atproto>=0.0.56",
    "mastodon-py>=1.8.1",
    "requests>=2.32.3",
    # Needed by the currently locked Mastodon.py on Python 3.13.
    "standard-imghdr>=3.13.0",
]
